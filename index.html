<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>LIFF 連線測試</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ color-scheme:light only; }
  *{box-sizing:border-box}
  body{
    margin:0;padding:18px;
    font-family:-apple-system,"Noto Sans TC",sans-serif;
    background:#f5f5f0;color:#333;line-height:1.6;
  }
  .card{
    max-width:480px;margin:0 auto;background:#fff;
    border-radius:14px;padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  h1{font-size:18px;margin:0 0 3px}
  .sub{font-size:12px;color:#999;margin:0 0 16px}

  #status{padding:11px 13px;border-radius:9px;font-size:13px;margin-bottom:16px;white-space:pre-wrap}
  .loading{background:#fff8e1;color:#8a6d00}
  .ok     {background:#e8f5e9;color:#2e6b34}
  .fail   {background:#ffebee;color:#b3261e}

  .profile{display:none;align-items:center;gap:12px;margin-bottom:16px;
           padding:14px;background:#f9f9f6;border-radius:11px}
  .profile.show{display:flex}
  .profile img{width:54px;height:54px;border-radius:50%;background:#eee;object-fit:cover;flex-shrink:0}
  .pname{font-weight:700;font-size:15px}

  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
  th{color:#888;font-weight:600;width:34%;white-space:nowrap}
  td{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}

  .copy-btn{
    width:100%;margin-top:12px;padding:11px;
    background:#06c755;color:#fff;border:none;border-radius:10px;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .copy-btn:active{opacity:.8}
  .hint{font-size:11.5px;color:#999;margin-top:14px}
</style>
</head>
<body>

<div class="card">
  <h1>LIFF 連線測試</h1>
  <p class="sub">確認能否自動取得使用者識別碼</p>

  <div id="status" class="loading">正在連線 LINE…</div>

  <div class="profile" id="profile">
    <img id="p-pic" alt="">
    <div>
      <div class="pname" id="p-name"></div>
      <div style="font-size:11.5px;color:#999" id="p-msg"></div>
    </div>
  </div>

  <table id="info" style="display:none">
    <tr><th>userId</th><td id="v-uid"></td></tr>
    <tr><th>暱稱</th><td id="v-name"></td></tr>
    <tr><th>開啟環境</th><td id="v-env"></td></tr>
    <tr><th>作業系統</th><td id="v-os"></td></tr>
    <tr><th>LIFF 版本</th><td id="v-ver"></td></tr>
  </table>

  <button class="copy-btn" id="copy-btn" style="display:none" onclick="copyId()">複製 userId</button>

  <p class="hint">
    本頁僅供測試，不會送出任何資料。<br>
    必須從 LINE 開啟才能辨識身分。
  </p>
</div>

<script>
const LIFF_ID = "2011533465-IUMILFYy";
let myUserId = "";

function setStatus(msg, cls){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls;
}

async function initLiff(){
  try{
    await liff.init({ liffId: LIFF_ID });

    if(!liff.isLoggedIn()){
      setStatus("尚未登入，正在導向 LINE 登入…", "loading");
      liff.login({ redirectUri: window.location.href });
      return;
    }

    const profile = await liff.getProfile();
    myUserId = profile.userId;

    document.getElementById("p-name").textContent = profile.displayName;
    document.getElementById("p-msg").textContent  = profile.statusMessage || "";
    if(profile.pictureUrl) document.getElementById("p-pic").src = profile.pictureUrl;
    document.getElementById("profile").classList.add("show");

    document.getElementById("v-uid").textContent  = profile.userId;
    document.getElementById("v-name").textContent = profile.displayName;
    document.getElementById("v-env").textContent  =
      liff.isInClient() ? "LINE 內建瀏覽器 ✓" : "外部瀏覽器（仍可運作）";
    document.getElementById("v-os").textContent   = liff.getOS() || "-";
    document.getElementById("v-ver").textContent  = liff.getVersion() || "-";
    document.getElementById("info").style.display = "table";
    document.getElementById("copy-btn").style.display = "block";

    setStatus("✓ 成功取得身分：" + profile.displayName, "ok");

  }catch(err){
    setStatus(
      "✗ 無法取得 LINE 身分\n\n" +
      "錯誤訊息：" + (err && err.message ? err.message : String(err)) + "\n\n" +
      "請確認：\n" +
      "1. 是否從 LIFF 網址開啟\n" +
      "2. LIFF ID 是否正確\n" +
      "3. Endpoint URL 是否與本頁網址相符",
      "fail"
    );
  }
}

function copyId(){
  if(!myUserId) return;
  const t = document.createElement("textarea");
  t.value = myUserId;
  document.body.appendChild(t);
  t.select();
  try{ document.execCommand("copy"); alert("已複製：" + myUserId); }
  catch(e){ alert("請長按下方文字手動複製"); }
  document.body.removeChild(t);
}

initLiff();
</script>
</body>
</html>
