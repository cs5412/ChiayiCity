<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>自備有禮｜上傳任務</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  color-scheme:light only;
  --cream:#f7f4ea; --card:#fff; --ink:#3d3226; --ink2:#7d7365; --ink3:#a9a196;
  --green:#5c8a4a; --brown:#8b6f47; --red:#c0503f; --line:#e5ded0;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:16px 14px 40px;background:var(--cream);color:var(--ink);
  font-family:-apple-system,"Noto Sans TC",sans-serif;line-height:1.6;
}
.wrap{max-width:520px;margin:0 auto}

.head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.head img{width:44px;height:44px;border-radius:50%;background:#e8e2d5;object-fit:cover}
.head .who{font-weight:700;font-size:15px}
.head .pts{font-size:12px;color:var(--ink2)}

#status{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;white-space:pre-wrap}
.loading{background:#fdf6e0;color:#8a6d00}
.ok{background:#e9f3e4;color:#3f6b31}
.fail{background:#fbeae7;color:#a8392a}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:13px}
.lbl{font-size:13px;font-weight:700;margin-bottom:9px;display:block}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:6px}

.tasks{display:grid;gap:8px}
.task{
  display:flex;align-items:center;gap:11px;padding:12px;
  border:1.5px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;
}
.task.on{border-color:var(--green);background:#f2f7ef}
.task.done{opacity:.45}
.task .em{font-size:22px;line-height:1}
.task .tt{font-weight:700;font-size:14px}
.task .td{font-size:11.5px;color:var(--ink2)}

input[type=text],input[type=number]{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font-size:15px;outline:none;
}
input:focus{border-color:var(--green)}
.storename{font-size:12.5px;margin-top:7px;font-weight:600}
.storeok{color:var(--green)} .storeng{color:var(--red)}

.shot{
  display:block;width:100%;padding:26px 12px;border:2px dashed var(--line);
  border-radius:12px;background:#fdfcf8;text-align:center;cursor:pointer;
}
.shot .ic{font-size:26px}
.shot .tx{font-size:13px;color:var(--ink2);margin-top:5px}
.shot.has{border-style:solid;border-color:var(--green);padding:0;overflow:hidden}
.shot img{width:100%;display:block;max-height:230px;object-fit:cover}
input[type=file]{display:none}

.btn{
  width:100%;padding:15px;border:none;border-radius:12px;background:var(--green);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;
}
.btn:disabled{background:#c3bfb6}
.btn.sub{background:transparent;color:var(--ink2);border:1px solid var(--line);font-size:14px;padding:11px;margin-top:9px}

.done-box{display:none;text-align:center;padding:28px 16px}
.done-box.show{display:block}
.done-box .tick{font-size:46px}
.done-box h2{font-size:19px;margin:10px 0 5px}
.done-box p{font-size:13.5px;color:var(--ink2);margin:0 0 6px}
.sn{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">

  <div class="head" id="head" style="display:none">
    <img id="ava" alt="">
    <div>
      <div class="who" id="who"></div>
      <div class="pts" id="pts"></div>
    </div>
  </div>

  <div id="status" class="loading">正在連線…</div>

  <div id="form">
    <div class="card">
      <span class="lbl">① 選擇任務</span>
      <div class="tasks" id="tasks"></div>
    </div>

    <div class="card" id="store-card" style="display:none">
      <span class="lbl">② 店家編號</span>
      <input id="store" type="text" inputmode="numeric" placeholder="例如 001" oninput="chkStore()">
      <div class="storename" id="storename"></div>
      <div class="hint">請掃描店家貼紙上的 QR Code，或輸入貼紙上的編號。</div>
    </div>

    <div class="card">
      <span class="lbl" id="lbl-p1">③ 自備容器照片（必要）</span>
      <label class="shot" id="box1">
        <input type="file" accept="image/*" onchange="pick(this,1)">
        <div id="in1"><div class="ic">📷</div><div class="tx">拍照或選擇照片</div></div>
      </label>
      <div class="hint">請讓「自備的容器」與「店家認證標章」同時入鏡。</div>
    </div>

    <div class="card">
      <span class="lbl">④ 當日消費證明（建議）</span>
      <label class="shot" id="box2">
        <input type="file" accept="image/*" onchange="pick(this,2)">
        <div id="in2"><div class="ic">🧾</div><div class="tx">發票、收據或訂單畫面</div></div>
      </label>
      <div class="hint">附上消費證明可加快審核，也能避免被誤判為重複上傳。</div>
    </div>

    <button class="btn" id="send" onclick="send()" disabled>送出</button>
    <button class="btn sub" onclick="location.href='records.html'">查看我的紀錄</button>
  </div>

  <div class="done-box" id="done">
    <div class="tick">✅</div>
    <h2 id="done-t"></h2>
    <p id="done-m"></p>
    <p class="sn" id="done-s"></p>
    <button class="btn" onclick="location.reload()">再上傳一筆</button>
    <button class="btn sub" id="close-btn" onclick="closeWin()">關閉</button>
  </div>

</div>

<script>
/* ═══ 設定：換成你自己的 ═══ */
const LIFF_ID = "2011533465-IUMILFYy";
const API     = "https://script.google.com/macros/s/AKfycbytQFDvJ9aBHqrz4TgAqz4pnNfwLv4dxUgjG9pBY1WFipiCKUF5jqiHtF91HX626ZhYHQ/exec";
/* ═════════════════════════ */

const TASKS = [
  {k:"A", em:"🥤", t:"自備容器", d:"帶環保杯、餐盒或袋到合作店家消費"},
  {k:"B", em:"🧳", t:"旅遊自備小樣", d:"自備盥洗用品或環保杯入住本市旅宿"},
  {k:"C", em:"♻️", t:"不用品交換", d:"到再使用據點捐出、交換或取用物品"}
];

let uid="", uname="", task="", ph1="", ph2="", weekDone={};

function $(id){ return document.getElementById(id); }
function setStatus(m,c){ const e=$("status"); e.textContent=m; e.className=c; }

/* ── 啟動 ── */
async function boot(){
  try{
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return; }

    const p = await liff.getProfile();
    uid = p.userId; uname = p.displayName;
    $("who").textContent = uname;
    if(p.pictureUrl) $("ava").src = p.pictureUrl;
    $("head").style.display = "flex";
    if(!liff.isInClient()) $("close-btn").style.display = "none";

    // 取回點數與本週completed狀態
    try{
      const r = await fetch(API + "?action=myRecords&userId=" + encodeURIComponent(uid));
      const d = await r.json();
      if(d.ok){
        $("pts").textContent = "目前 " + d.points + " 點・" + d.level;
        weekDone = d.weekDone || {};
      }
    }catch(e){}

    renderTasks();
    setStatus("✓ 已辨識身分，請選擇任務", "ok");
    check();
  }catch(err){
    setStatus("無法取得 LINE 身分\n請從 LINE 的選單重新開啟本頁\n\n" +
              (err && err.message ? err.message : err), "fail");
  }
}

function renderTasks(){
  const box = $("tasks"); box.innerHTML = "";
  TASKS.forEach(t=>{
    const d = document.createElement("div");
    const done = !!weekDone[t.k];
    d.className = "task" + (done ? " done" : "");
    d.innerHTML = '<div class="em">'+t.em+'</div><div><div class="tt">'+t.t+
                  (done?'（本週已完成）':'')+'</div><div class="td">'+t.d+'</div></div>';
    if(!done) d.onclick = ()=>selTask(t.k, d);
    box.appendChild(d);
  });
}

function selTask(k, el){
  task = k;
  document.querySelectorAll(".task").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");
  $("store-card").style.display = (k === "A") ? "block" : "none";
  check();
}

/* ── 店家查驗 ── */
let storeOK = false, storeTimer = null;
function chkStore(){
  clearTimeout(storeTimer);
  storeOK = false; check();
  const c = $("store").value.trim();
  if(!c){ $("storename").textContent = ""; return; }
  storeTimer = setTimeout(async ()=>{
    try{
      const r = await fetch(API + "?action=stores");
      const d = await r.json();
      const hit = (d.stores||[]).find(s=>s.code === c);
      if(hit){
        storeOK = true;
        $("storename").className = "storename storeok";
        $("storename").textContent = "✓ " + hit.name;
      }else{
        $("storename").className = "storename storeng";
        $("storename").textContent = "查無此編號，請確認貼紙";
      }
    }catch(e){ storeOK = true; $("storename").textContent = ""; }
    check();
  }, 400);
}

/* ── 照片：壓縮後轉 base64 ── */
function pick(inp, n){
  const f = inp.files && inp.files[0];
  if(!f) return;
  compress(f, (dataUrl)=>{
    if(n === 1){ ph1 = dataUrl; showImg("box1","in1",dataUrl); }
    else       { ph2 = dataUrl; showImg("box2","in2",dataUrl); }
    check();
  });
}

function showImg(boxId, innerId, src){
  const b = $(boxId);
  b.classList.add("has");
  $(innerId).innerHTML = '<img src="'+src+'">';
}

/* 長邊縮到 1000px、品質 0.7，約 100–250KB。
   夠清楚可辨識容器，又不會拖垮上傳。 */
function compress(file, cb){
  const img = new Image();
  const rd = new FileReader();
  rd.onload = e => { img.src = e.target.result; };
  img.onload = ()=>{
    const MAX = 1000;
    let w = img.width, h = img.height;
    if(w > h && w > MAX){ h = h * MAX / w; w = MAX; }
    else if(h >= w && h > MAX){ w = w * MAX / h; h = MAX; }
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    cb(cv.toDataURL("image/jpeg", 0.7));
  };
  rd.readAsDataURL(file);
}

function check(){
  const need = task && ph1 && (task !== "A" || storeOK);
  $("send").disabled = !need;
}

/* ── 送出：POST 一次送完 ── */
let sending = false;
async function send(){
  if(sending) return;
  sending = true;
  const btn = $("send");
  btn.disabled = true; btn.textContent = "上傳中…";

  const body = {
    action: "submit",
    userId: uid,
    displayName: uname,
    task: task,
    storeCode: task === "A" ? $("store").value.trim() : "",
    photoContainer: ph1,
    photoProof: ph2,
    wid: Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,10)
  };

  try{
    const r = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},  // 避免預檢請求
      body: JSON.stringify(body)
    });
    const d = await r.json();

    if(d.ok){
      $("form").style.display = "none";
      $("status").style.display = "none";
      $("done").classList.add("show");
      $("done-t").textContent = d.status === "通過" ? "任務完成！" : "上傳成功";
      $("done-m").textContent = d.msg || "";
      $("done-s").textContent = d.serial ? "編號 " + d.serial : "";
    }else{
      alert(d.error || "送出失敗，請再試一次");
      btn.disabled = false; btn.textContent = "送出";
      sending = false;
    }
  }catch(err){
    alert("網路連線失敗，請確認訊號後再試一次");
    btn.disabled = false; btn.textContent = "送出";
    sending = false;
  }
}

function closeWin(){ if(liff.isInClient()) liff.closeWindow(); }

/* 若由 QR Code 帶入店家編號：?s=001 */
(function(){
  const m = location.search.match(/[?&]s=([^&]+)/);
  if(m){ window.addEventListener("load", ()=>{ $("store").value = decodeURIComponent(m[1]); }); }
})();

boot();
</script>
</body>
</html>
