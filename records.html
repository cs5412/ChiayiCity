<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>源頭減量行為獎勵系統｜我的紀錄</title>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  color-scheme:light only;
  --cream:#f7f4ea; --card:#fff; --ink:#3d3226; --ink2:#7d7365; --ink3:#a9a196;
  --green:#5c8a4a; --brown:#8b6f47; --red:#c0503f; --line:#e5ded0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 14px 40px;background:var(--cream);color:var(--ink);
     font-family:-apple-system,"Noto Sans TC",sans-serif;line-height:1.6}
.wrap{max-width:520px;margin:0 auto}

#status{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;white-space:pre-wrap}
#boot{padding:34px 18px 30px;text-align:center}
.ring{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
      border:3px solid #e5ded0;border-top-color:var(--green);
      animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-tx{font-size:14px;font-weight:700;color:var(--ink)}
.boot-sub{font-size:12px;color:var(--ink2);margin-top:4px;min-height:18px}
.boot-bar{width:170px;height:3px;margin:15px auto 0;background:#e5ded0;
          border-radius:99px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:8%;background:var(--green);
            border-radius:99px;transition:width .5s ease}
.sk{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:13px}
.sk.big{height:96px;background:#ece7db;border:none}
.sk-row{height:13px;border-radius:99px;margin:9px 0;
        background:linear-gradient(90deg,#efeade 25%,#f7f4ea 37%,#efeade 63%);
        background-size:400% 100%;animation:sheen 1.5s ease-in-out infinite}
.sk-row.w40{width:40%} .sk-row.w70{width:70%} .sk-row.tall{height:42px;border-radius:11px}
@keyframes sheen{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.ring{animation-duration:2s}.sk-row{animation:none}}
.loading{background:#fdf6e0;color:#8a6d00}
.fail{background:#fbeae7;color:#a8392a}

.pt-card{
  display:flex;align-items:center;gap:14px;
  background:#5c8a4a;
  background:-webkit-linear-gradient(315deg,#527d42,#7aa563);
  background:linear-gradient(135deg,#527d42,#7aa563);
  border-radius:16px;padding:20px 18px;margin-bottom:14px;
  box-shadow:0 3px 12px rgba(82,125,66,.25);
}
.pt-left{flex:1;min-width:0}
.pt-card .n{font-size:44px;font-weight:800;line-height:1;color:#fff}
.pt-card .u{font-size:12.5px;color:rgba(255,255,255,.9);margin-top:3px}
.pt-card .lv{
  display:inline-block;margin-top:11px;background:rgba(255,255,255,.22);
  padding:4px 13px;border-radius:99px;font-size:11.5px;color:#fff;
}
.pt-btn{
  background:#fff;border:none;color:#4a7a39;border-radius:14px;
  padding:14px 16px;font-size:13.5px;font-weight:800;line-height:1.4;
  cursor:pointer;white-space:nowrap;text-align:center;
  min-width:92px;box-shadow:0 2px 8px rgba(0,0,0,.14);
}
.pt-btn .pl{display:block;font-size:24px;line-height:1;margin-bottom:2px}
.pt-btn:active{transform:scale(.97);background:#eef3ea}

.fold{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
      user-select:none;margin-bottom:0}
.fold-i{font-size:11.5px;color:var(--ink2);font-weight:500}
#recs.collapsed{display:none}
#recs{margin-top:11px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:16px;margin-bottom:13px}
h2{font-size:14px;margin:0 0 11px}

.wk{display:flex;gap:7px;flex-wrap:wrap}
.wk div{flex:1;min-width:96px;text-align:center;padding:10px 6px;
        border:1px solid var(--line);border-radius:10px;font-size:12px}
.wk .can{border-color:var(--green);color:var(--green);font-weight:700}
.wk .did{background:#f2f0ea;color:var(--ink3)}

.rec{display:flex;justify-content:space-between;gap:10px;
     padding:11px 0;border-bottom:1px solid #f0ece2;font-size:13px}
.rec:last-child{border-bottom:none}
.rec .t{font-size:11.5px;color:var(--ink3)}
.st{font-size:11.5px;font-weight:700;white-space:nowrap;padding-top:2px}
.s-pass{color:var(--green)} .s-wait{color:#b58a2b} .s-rej{color:var(--red)}
.rsn{font-size:11px;color:var(--red);margin-top:2px}

.gift{display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:12px 0;border-bottom:1px solid #f0ece2}
.gift:last-child{border-bottom:none}
.gift .gn{font-size:13.5px;font-weight:600}
.gift .gc{font-size:11.5px;color:var(--ink2)}
.gift button{background:var(--green);color:#fff;border:none;border-radius:9px;
             padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.gift button:disabled{background:#d3cfc6}

.empty{text-align:center;color:var(--ink3);font-size:13px;padding:22px 0}
.cp{padding:14px 0;border-bottom:1px solid #f0ece2}
.cp:last-child{border-bottom:none}
.cp-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cp .ci{font-size:14px;font-weight:700}
.cp .cc{font-family:ui-monospace,monospace;font-size:21px;font-weight:800;
        color:var(--brown);letter-spacing:.1em;margin:6px 0 2px}
.cp.cp-done .cc{color:var(--ink3);font-weight:600}
.cp .ct{font-size:11.5px;color:var(--ink3)}
.cpst{font-size:11.5px;font-weight:700;white-space:nowrap;padding:4px 11px;border-radius:99px}
.cpst.cp-new{background:#fdf3e0;color:#8a6516}
.cpst.cp-ret{background:#e6eff7;color:#2f5f8f}
.cpst.cp-done{background:#eaf3e5;color:#3f6b31}
.cpst.cp-void{background:#f2efe8;color:#8a8378}
.cp.cp-void{opacity:.7}
.steps{display:flex;gap:6px;margin:9px 0 8px;flex-wrap:wrap}
.steps span{font-size:11px;padding:3px 9px;border-radius:99px;background:#f2efe8;color:#b0a99e}
.steps span.on{background:var(--green);color:#fff;font-weight:700}
.step-go{border:none;background:#06c755;color:#fff;font-size:11.5px;font-weight:700;
         padding:5px 12px;border-radius:99px;cursor:pointer;line-height:1.5}
.step-go:active{opacity:.85}
.cp-act{display:flex;gap:8px;margin-top:4px}
.cp-act button{flex:1;padding:11px;border-radius:10px;font-size:13.5px;font-weight:700;
               border:none;cursor:pointer}
.bcopy{background:var(--brown);color:#fff}
.bline{background:#06c755;color:#fff}
.bret{background:#fff;color:var(--green);border:1.5px solid var(--green);width:100%}
.cp-tip{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:8px;
        background:#faf8f3;border-radius:8px;padding:9px 11px}
.cp-tip.ok{background:#eff6ec;color:#3f6b31}

.org{margin:30px auto 0;text-align:center;font-size:11px;color:var(--ink3);
     line-height:2;letter-spacing:.02em}
.gift.out{opacity:.5}
.lv1{color:var(--green);font-weight:600}
.lv0{color:var(--red);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="status" class="loading" style="display:none"></div>

  <div id="boot">
    <div class="ring"></div>
    <div class="boot-tx" id="boot-tx">正在連線…</div>
    <div class="boot-sub" id="boot-sub">第一次開啟需要幾秒鐘</div>
    <div class="boot-bar"><i id="boot-bar-i"></i></div>
  </div>

  <div id="skeleton">
    <div class="sk big"></div>
    <div class="sk"><div class="sk-row w40"></div><div class="sk-row tall"></div></div>
    <div class="sk"><div class="sk-row w40"></div><div class="sk-row w70"></div>
      <div class="sk-row tall"></div></div>
  </div>
  <div id="body" style="display:none">

    <div class="pt-card">
      <div class="pt-left">
        <div class="n" id="pt">0</div>
        <div class="u">可用點數</div>
        <div class="lv" id="lv"></div>
      </div>
      <button class="pt-btn" onclick="go('index.html')"><span class="pl">＋</span>上傳任務</button>
    </div>

    <div class="card">
      <h2>本週任務</h2>
      <div style="font-size:11.5px;color:var(--ink2);margin:-4px 0 10px;line-height:1.6">顯示本週已完成次數。額度每週一重新計算。</div>
      <div class="wk" id="wk"></div>
    </div>

    <div class="card">
      <h2>兌換獎勵</h2>
      <div style="font-size:11.5px;color:var(--ink2);margin:-4px 0 10px;line-height:1.6">點數足夠時按下兌換，系統會產生專屬券碼並顯示於下方「兌換紀錄」，依序操作即可完成。</div>
      <div id="gifts"></div>
    </div>

    <div class="card">
      <h2>兌換紀錄</h2>
      <div style="font-size:11.5px;color:var(--ink2);margin:-4px 0 10px;line-height:1.6">兌換後請將兌換碼傳給我們，我們確認後會在聊天室提供電子券代碼。標示「已核發」代表已經發給你了。</div>
      <div id="coupons"></div>
    </div>

    <div class="card">
      <h2 class="fold" onclick="toggleRecs()">
        <span>最近上傳</span>
        <span class="fold-i" id="fold-i">展開 ▾</span>
      </h2>
      <div id="recs" class="collapsed"></div>
    </div>

  </div>

  <div class="org">
    <div>指導單位：環境部資源循環署　補助</div>
    <div>主辦單位：嘉義市政府環境保護局　廣告</div>
    <div>執行單位：志欣環保工程有限公司</div>
  </div>

</div>

<script>
/* ═══ 設定：換成你自己的 ═══ */
const LIFF_ID = "2011533465-IUMILFYy";
const API     = "https://script.google.com/macros/s/AKfycbytQFDvJ9aBHqrz4TgAqz4pnNfwLv4dxUgjG9pBY1WFipiCKUF5jqiHtF91HX626ZhYHQ/exec";
/* 改這支檔案時，要與 Code.gs 的 CFG.CLIENT_VERSION 改成同一個值 */
const VERSION = "2026-09-14a";
/* ═════════════════════════ */

/* 獎勵品項由後端提供，改設定不必改前端 */
let GIFTS = [];
let uid = "", uname = "", idToken = "", myPoints = 0;

function $(i){ return document.getElementById(i); }
function setStatus(m,c){
  bootDone();
  const b=$("boot"), k=$("skeleton");
  if(b) b.style.display="none";
  if(k) k.style.display="none";
  const e=$("status"); e.style.display=""; e.textContent=m; e.className=c;
}

const BOOT_STEPS = [
  [12, "正在連線…",  "第一次開啟需要幾秒鐘"],
  [40, "已辨識身分", "正在讀取你的點數與兌換紀錄"],
  [72, "快好了…",    "整理資料中"],
  [100,"完成",       ""]
];
let bootTimer = null;
function bootStep(i){
  const s = BOOT_STEPS[i]; if(!s) return;
  const bar = $("boot-bar-i"), tx = $("boot-tx"), sub = $("boot-sub");
  if(bar) bar.style.width = s[0] + "%";
  if(tx)  tx.textContent  = s[1];
  if(sub) sub.textContent = s[2];
}
function bootAutoAdvance(){
  let i = 0; bootStep(0);
  bootTimer = setInterval(()=>{ if(i < 2) bootStep(++i); }, 1400);
}
function bootDone(){ if(bootTimer){ clearInterval(bootTimer); bootTimer = null; } }

/* ── 版本握手 ────────────────────────────────────────────────
   POST 請求不會被快取，所以後端回傳的版本號一定是最新的。
   拿它跟本頁內嵌的 VERSION 比對，不一致就帶著新版號重新載入，
   對 WebView 來說那是另一個網址，一定會重抓。
   重載過一次仍對不上就停下來，避免無限迴圈。            ── */
function checkVersion(serverVer){
  if(!serverVer || serverVer === VERSION) return true;

  // 防迴圈記號放在網址裡（?vt=1），不放 sessionStorage。
  // LINE 的內建瀏覽器在換網址時常會清掉 storage，記號一旦遺失就會無限重載，
  // 畫面停在全白。網址參數一定帶得過去，所以只會重載一次。
  let tried = false;
  try{ tried = new URLSearchParams(location.search).get("vt") === "1"; }catch(e){}

  if(tried){
    setStatus("頁面版本較舊（本頁 " + VERSION + "，後端 " + serverVer + "）。\n\n" +
              "多半是 Apps Script 改了程式但沒有重新部署，\n" +
              "或三個版本號沒有改成一致。\n\n" +
              "民眾若看到此畫面，請關閉後從 LINE 選單重新開啟。", "fail");
    return false;
  }
  try{
    const u = new URL(location.href);
    u.searchParams.set("v", serverVer);   // 保留 ?s=001 之類原有參數
    u.searchParams.set("vt", "1");        // 標記已經重載過一次
    location.replace(u.toString());
  }catch(e){
    location.replace(location.pathname +
      "?v=" + encodeURIComponent(serverVer) + "&vt=1");
  }
  return false;
}

/* 未捕捉的錯誤改成顯示文字，不要留下無從判斷的白畫面 */
window.addEventListener("error", function(ev){
  try{
    setStatus("頁面發生錯誤，無法載入。\n\n" +
              (ev.message || "") + "\n\n請關閉後重新開啟，若持續發生請告知承辦人員。", "fail");
  }catch(e){}
});
window.addEventListener("unhandledrejection", function(ev){
  try{
    const r = ev.reason;
    setStatus("連線發生問題，無法載入。\n\n" +
              ((r && (r.message || r)) || "") + "\n\n請稍後再試一次。", "fail");
  }catch(e){}
});

/** 跨頁時把版本號帶著走，否則第二頁又會吃到舊的 */
function go(path){
  location.href = path + "?v=" + encodeURIComponent(VERSION);
}


/** 一律走 POST 並帶上 ID Token，後端會以驗證結果為準，不採信前端送的 userId */
async function api(body){
  const r = await fetch(API, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({userId:uid, idToken:idToken}, body))
  });
  return await r.json();
}

async function boot(){
  try{
    // 趁 LIFF 初始化的空檔先叫醒 Apps Script，避免冷啟動壓在關鍵路徑上
    try{ fetch(API + "?action=ping", {mode:"no-cors", cache:"no-store"}); }catch(e){}
    bootAutoAdvance();
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return; }
    const p = await liff.getProfile();
    uid = p.userId; uname = p.displayName;
    try{ idToken = liff.getIDToken() || ""; }catch(e){ idToken = ""; }
    bootStep(1);
    await load();
  }catch(e){
    setStatus("無法取得身分，請從 LINE 選單開啟本頁", "fail");
  }
}

async function load(){
  let d;
  try{ d = await api({action:"myRecords"}); }
  catch(e){
    setStatus("連線失敗，請稍後再試", "fail");
    return;
  }
  if(!d.ok){
    setStatus(d.error || "載入失敗", "fail");
    return;
  }
  if(!checkVersion(d.clientVersion)) return;
  bootStep(2);
  myPoints = d.points;
  $("pt").textContent = d.points;
  $("lv").textContent = d.level + "・累計通過 " + d.passCount + " 次";

  const wk = d.week || {};
  $("wk").innerHTML = Object.keys(wk).map(k=>{
    const w = wk[k];
    let txt;
    if(w.once)           txt = w.status === "通過" ? "已完成"
                             : (w.status ? "審核中" : "尚未完成");
    else if(w.limit > 0) txt = w.used + " / " + w.limit + " 次";
    else                 txt = "本週 " + w.used + " 次";
    return '<div class="'+(w.full?"did":"can")+'">'+esc(w.name)+'<br>'+txt+'</div>';
  }).join("");

  GIFTS = d.gifts || [];
  $("gifts").innerHTML = GIFTS.map((g,i)=>{
    const out  = g.soldOut;
    const can  = !out && myPoints >= g.cost;
    const left = g.left < 0 ? "不限量"
               : (out ? "已兌完" : "剩餘 " + g.left + " 份");
    return '<div class="gift'+(out?" out":"")+'"><div><div class="gn">'+esc(g.item)+'</div>'+
      '<div class="gc">需 '+g.cost+' 點・<span class="'+(out?"lv0":"lv1")+'">'+left+'</span></div></div>'+
      '<button '+(can?"":"disabled")+' onclick="ex('+i+')">'+
      (out ? "已兌完" : (myPoints>=g.cost ? "兌換" : "點數不足"))+'</button></div>';
  }).join("");

  const cps = d.coupons || [];
  $("coupons").innerHTML = cps.length
    ? cps.map(c=>{
        const st = c.status;
        const isNew  = st === "已兌換";
        const isRet  = st === "已回傳";
        const isDone = st === "已核發";
        const isVoid = st === "已作廢";
        const cls = isVoid ? "cp-void"
                  : isDone ? "cp-done"
                  : (isRet ? "cp-ret" : "cp-new");

        // 已作廢：不顯示流程，只說明狀況
        if(isVoid){
          return '<div class="cp cp-void">'+
            '<div class="cp-head"><div class="ci">'+esc(c.item)+'</div>'+
            '<div class="cpst cp-void">'+esc(st)+'</div></div>'+
            '<div class="ct">'+esc(c.time)+'　'+c.cost+' 點</div>'+
            '<div class="cp-tip">這筆兌換已取消，'+c.cost+' 點已退回你的帳戶。'+
            (c.info ? '<br>'+esc(c.info) : '')+'</div></div>';
        }

        // 已核發時，第三格直接變成可點的按鈕，點了就去聊天室拿代碼
        const step3 = isDone
          ? '<button class="step-go" onclick="openLine()">③ 已核發・前往聊天室領取 ›</button>'
          : '<span>③ 已核發</span>';
        const steps = '<div class="steps">' +
          '<span class="on">① 已兌換</span>' +
          '<span class="'+((isRet||isDone)?"on":"")+'">② 已回傳</span>' +
          step3 + '</div>';

        let act = "";
        if(isNew){
          act = '<div class="cp-act">' +
            '<button class="bcopy" onclick="copyCode(\''+c.code+'\')">① 複製兌換碼</button>' +
            '<button class="bline" onclick="openLine()">② 前往聊天室貼上</button></div>' +
            '<div class="cp-act"><button class="bret" onclick="ret(\''+c.code+'\')">' +
            '③ 我已回傳</button></div>' +
            '<div class="cp-tip">依照 ①②③ 順序操作即可。貼上後記得回來按「我已回傳」，' +
            '我們才知道要幫你核發。</div>';
        }else if(isRet){
          act = '<div class="cp-tip">已收到你的回傳，我們確認後會直接在聊天室提供電子券代碼，請留意訊息。</div>';
        }else if(isDone){
          // 電子券代碼一律於聊天室提供，此處不顯示，避免與兌換碼混淆
          act = '<div class="cp-tip ok">電子券已於 '+esc(c.issuedTime)+' 核發，' +
                '請至聊天室查看代碼。</div>';
        }

        // 已核發者不再顯示兌換碼，避免與電子券代碼混淆
        const codeLine = isDone ? '' : '<div class="cc">'+esc(c.code)+'</div>';
        return '<div class="cp '+cls+'">'+
          '<div class="cp-head"><div class="ci">'+esc(c.item)+'</div>'+
          '<div class="cpst '+cls+'">'+esc(st)+'</div></div>'+
          codeLine +
          '<div class="ct">'+esc(c.time)+'　'+c.cost+' 點</div>'+
          steps + act + '</div>';
      }).join("")
    : '<div class="empty">還沒有兌換紀錄</div>';

  $("recs").innerHTML = d.records.length
    ? d.records.map(r=>{
        const cls = r.status==="通過" ? "s-pass" : (r.status==="退件" ? "s-rej" : "s-wait");
        const extra = [r.sub, r.store, r.items].filter(Boolean).map(esc).join("　");
        const pt = (r.status==="通過" && r.points) ? '<br>+'+r.points+' 點' : '';
        return '<div class="rec"><div><div>'+esc(r.task)+'</div>'+
               (extra?'<div class="t">'+extra+'</div>':'')+
               '<div class="t">'+esc(r.time)+'</div>'+
               (r.status==="退件"&&r.reason?'<div class="rsn">'+esc(r.reason)+'</div>':'')+
               '</div><div class="st '+cls+'">'+esc(r.status)+pt+'</div></div>';
      }).join("")
    : '<div class="empty">還沒有上傳紀錄</div>';

  bootStep(3);
  bootDone();
  $("boot").style.display = "none";
  $("skeleton").style.display = "none";
  $("status").style.display = "none";
  $("body").style.display = "block";
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g,
    c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

const LINE_OA = "https://lin.ee/90fLchb";

function openLine(){
  try{
    if(typeof liff !== "undefined" && liff.isInClient && liff.isInClient()){
      liff.openWindow({ url: LINE_OA, external: false });
      return;
    }
  }catch(e){}
  window.open(LINE_OA, "_blank");
}

function toggleRecs(){
  const el = $("recs"), ic = $("fold-i");
  const hidden = el.classList.toggle("collapsed");
  ic.textContent = hidden ? "展開 ▾" : "收起 ▴";
}

function copyCode(code){
  const t = document.createElement("textarea");
  t.value = code; document.body.appendChild(t); t.select();
  try{ document.execCommand("copy"); alert("已複製兌換碼：" + code + "\n\n請貼到本官方帳號的聊天室傳送給我們。"); }
  catch(e){ alert("請長按兌換碼手動複製：" + code); }
  document.body.removeChild(t);
}

async function ret(code){
  if(!confirm("確認你已經把兌換碼傳送給我們了嗎？")) return;
  try{
    const d = await api({action:"markReturned", code:code});
    if(d.ok){ alert(d.already ? "先前已標記過了" : "已記錄，我們會盡快核發電子券"); await load(); }
    else alert(d.error || "操作失敗");
  }catch(e){ alert("連線失敗，請稍後再試"); }
}

let busy = false;
async function ex(i){
  if(busy) return;
  const g = GIFTS[i];
  if(!confirm("確定用 " + g.cost + " 點兌換「" + g.item + "」嗎？")) return;
  busy = true;
  try{
    const d = await api({action:"issueCode", displayName:uname, item:g.item});
    if(d.ok){
      alert("兌換成功！\n\n兌換碼：" + d.code +
            "\n\n請將此兌換碼複製後，貼到本官方帳號的聊天室傳送給我們，" +
            "我們確認後會發送電子券。\n\n下方「兌換紀錄」有複製按鈕可使用。");
      await load();
    }else{
      alert(d.error || "兌換失敗");
    }
  }catch(e){
    alert("連線失敗，請稍後再試");
  }
  busy = false;
}

boot();
</script>
